<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema RH - Cálculos Trabalhistas</title>

    <!-- Importação dos estilos modulares -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app-container">
    <header class="app-header">
        <h1>Sistema RH</h1>
        <p>Módulo de Cálculos Trabalhistas</p>
    </header>

    <main class="app-main">
        <!-- Navegação entre os cálculos. -->
        <nav class="tabs">
            <button class="tabs__btn tabs__btn--active" data-calculo="salarioLiquido">Salário Líquido</button>
            <button class="tabs__btn" data-calculo="decinoTeceiro">13º Salário</button>
            <button class="tabs__btn" data-calculo="ferias">Férias</button>
        </nav>

        <!-- Formulário compartilhado entre os cálculos. -->
        <section class="card">

            <!-- Mensagem de erro (inicialmente oculta). -->
            <div id="mensagem-erro" class="alert alert--danger" style="display: none;"></div>

            <form id="form-calculo" class="form">
                <!-- Campo oculto que identifica o cálculo selecionado. -->
                <input type="hidden" id="tipo-calculo" value="salarioLiquido">

                <div class="form__row">
                    <div class="form__group">
                        <label class="form__label" for="salario">Salário Bruto (R$)</label>
                        <input class="form__input" type="number" id="salario" step="0.01" required>
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="conducao">Descontar vale-transporte?</label>
                        <select class="form__input" id="conducao">
                            <option value="false">Não</option>
                            <option value="true">Sim</option>
                        </select>
                    </div>
                </div>

                <!-- Campos de dias trabalhados, meses trabalhados e envio. -->

                <div class="form__row">
                    <div class="form__group">
                        <label class="form__label" for="diasTrabalhados">Dias trabalhados</label>
                        <input class="form__input" type="number" id="diasTrabalhados" value="30" required>
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="mesesTrabalhados">Meses trabalhados</label>
                        <input class="form__input" type="number" id="mesesTrabalhados" value="12" max="12" required>
                    </div>
                </div>

                <div class="form__actions">
                    <button type="submit" class="btn btn--primary" id="btn-submit">Gerar Holerite</button>
                </div>
            </form>
        </section>

        <!-- Recibo (Holerite) - Inicia oculto -->
        <section id="holerite-container" class="holerite" style="display: none;">
            <div class="holerite__header">
                <h2>Recibo de Pagamento</h2>
                <span id="holerite-tipo" class="holerite__badge">Salário Líquido</span>
            </div>

            <div class="holerite__table-wrapper">
                <table class="holerite__table">
                    <thead>
                    <tr>
                        <th>Descrição</th>
                        <th class="text-right">Vencimentos</th>
                        <th class="text-right">Descontos</th>
                    </tr>
                    </thead>
                    <tbody id="holerite-body">
                    <!-- Preenchido via JavaScript. -->
                    </tbody>
                    <tfoot>
                    <tr>
                        <td><strong>Totais</strong></td>
                        <td class="text-right text-success" id="total-vencimentos">R$ 0,00</td>
                        <td class="text-right text-danger" id="total-descontos">R$ 0,00</td>
                    </tr>
                    <tr class="holerite__liquido">
                        <td colspan="2"><strong>Valor líquido a receber ➔</strong></td>
                        <td class="text-right"><strong id="valor-liquido">R$ 0,00</strong></td>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </section>
    </main>
</div>

<!-- O atributo type="module" permite importar módulos JavaScript. -->
<script type="module" src="js/main.js"></script>
</body>
</html>
